<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QrPix Multi</title>
  <link rel="manifest" href="manifest.json?v=2">
  <meta name="theme-color" content="#12151e">
  <script stroke-linecap="round" src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #12151e; color: #ffffff; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .container { width: 100%; max-width: 450px; background: #1a1e2d; padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #36cfa0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #a0aec0; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2d3748; background: #0f121d; color: #fff; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: #36cfa0; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #36cfa0; color: #0a0c12; }
    .btn-secondary { background: #f0625d; color: #fff; }
    .btn-danger { background: #e53e3e; color: #fff; margin-top: 5px; width: 100%; }
    #qrcode { display: flex; justify-content: center; margin: 20px 0; padding: 15px; background: #fff; border-radius: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>QrPix Multi</h1>

  <div class="form-group">
    <label for="minhasChaves">Minhas Chaves Salvas:</label>
    <select id="minhasChaves" onchange="carregarChaveSelecionada()">
      <option value="">-- Selecione para carregar --</option>
    </select>
  </div>

  <button type="button" class="btn-danger hidden" id="btnExcluir" onclick="excluirChaveAtual()">Excluir Chave Selecionada</button>

  <hr style="border: 0.5px solid #2d3748; margin: 20px 0;">

  <form id="pixForm" onsubmit="gerarPix(event)">
    <div class="form-group">
      <label for="banco">Nome do Banco / Identificador:</label>
      <input type="text" id="banco" placeholder="Ex: Nubank, Itaú..." required>
    </div>

    <div class="form-group">
      <label for="tipoChave">Tipo da Chave:</label>
      <select id="tipoChave" required>
        <option value="CPF">CPF</option>
        <option value="CNPJ">CNPJ</option>
        <option value="E-mail">E-mail</option>
        <option value="Celular">Celular</option>
        <option value="EVP">Chave Aleatória (EVP)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="chave">Chave Pix:</label>
      <input type="text" id="chave" placeholder="Digite a chave Pix" required>
    </div>

    <div class="form-group">
      <label for="nome">Nome do Beneficiário:</label>
      <input type="text" id="nome" placeholder="Nome completo" required>
    </div>

    <div class="form-group">
      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" placeholder="Ex: Fortal/SP..." required>
    </div>

    <div class="form-group">
      <label for="valor">Valor (Opcional):</label>
      <input type="number" step="0.01" id="valor" placeholder="0.00">
    </div>

    <div class="btn-group">
      <button type="button" class="btn-secondary" onclick="salvarChaveAtual()">Salvar Chave</button>
      <button type="submit" class="btn-primary">Gerar QR Code</button>
    </div>
  </form>

  <div id="qrArea" class="hidden">
    <div id="qrcode"></div>
    <div class="form-group">
      <label>Código Copia e Cola:</label>
      <input type="text" id="pixCopiaCola" readonly>
    </div>
    <button type="button" class="btn-primary" style="width:100%" onclick="copiarPix()">Copiar Código Pix</button>
  </div>
</div>

<script>
  let chavesSalvas = [];

  window.onload = function() {
    atualizarListaChaves();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  };

  function carregarChavesDoStorage() {
    const dados = localStorage.getItem('qrpix_chaves_multi');
    return dados ? JSON.parse(dados) : [];
  }

  function salvarChavesNoStorage(lista) {
    localStorage.setItem('qrpix_chaves_multi', JSON.stringify(lista));
  }

  function atualizarListaChaves() {
    chavesSalvas = carregarChavesDoStorage();
    const select = document.getElementById('minhasChaves');
    select.innerHTML = '<option value="">-- Selecione para carregar --</option>';

    chavesSalvas.forEach((item, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${item.banco} (${item.tipoChave}) - ${item.nome}`;
      select.appendChild(option);
    });

    document.getElementById('btnExcluir').classList.add('hidden');
  }

  function salvarChaveAtual() {
    const banco = document.getElementById('banco').value.trim();
    const tipoChave = document.getElementById('tipoChave').value;
    const chave = document.getElementById('chave').value.trim();
    const nome = document.getElementById('nome').value.trim();
    const cidade = document.getElementById('cidade').value.trim();

    if (!banco || !chave || !nome || !cidade) {
      alert("Preencha todos os campos obrigatórios antes de salvar!");
      return;
    }

    const novaChave = { id: Date.now(), banco, tipoChave, chave, nome, cidade };
    chavesSalvas = carregarChavesDoStorage();
    
    // Verifica se já existe a exata mesma combinação de banco + tipo de chave para atualizar
    const indexExistente = chavesSalvas.findIndex(item => item.banco.toLowerCase() === banco.toLowerCase() && item.tipoChave === tipoChave);

    if (indexExistente >= 0) {
      chavesSalvas[indexExistente] = novaChave;
    } else {
      chavesSalvas.push(novaChave);
    }

    salvarChavesNoStorage(chavesSalvas);
    atualizarListaChaves();
    alert(`Chave para ${banco} (${tipoChave}) salva com sucesso!`);
  }

  function carregarChaveSelecionada() {
    const index = document.getElementById('minhasChaves').value;
    if (index === "") {
      document.getElementById('btnExcluir').classList.add('hidden');
      return;
    }

    const item = chavesSalvas[index];
    if (item) {
      document.getElementById('banco').value = item.banco;
      document.getElementById('tipoChave').value = item.tipoChave;
      document.getElementById('chave').value = item.chave;
      document.getElementById('nome').value = item.nome;
      document.getElementById('cidade').value = item.cidade;
      document.getElementById('btnExcluir').classList.remove('hidden');
    }
  }

  function excluirChaveAtual() {
    const index = document.getElementById('minhasChaves').value;
    if (index === "") return;

    if (confirm("Deseja realmente excluir esta chave cadastrada?")) {
      chavesSalvas.splice(index, 1);
      salvarChavesNoStorage(chavesSalvas);
      atualizarListaChaves();
      document.getElementById('pixForm').reset();
      alert("Chave removida!");
    }
  }

  function CRC16(str) {
    let crc = 0xFFFF;
    for (let c = 0; c < str.length; c++) {
      crc ^= str.charCodeAt(c) << 8;
      for (let i = 0; i < 8; i++) {
        if ((crc & 0x8000) !== 0) {
          crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
        } else {
          crc = (crc << 1) & 0xFFFF;
        }
      }
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  }

  function gerarPix(e) {
    e.preventDefault();
    const chave = document.getElementById('chave').value.trim();
    const nome = document.getElementById('nome').value.trim();
    const cidade = document.getElementById('cidade').value.trim();
    const valorNum = parseFloat(document.getElementById('valor').value);

    let payloadKey = `0014br.gov.bcb.pix01${chave.length.toString().padStart(2, '0')}${chave}`;
    let merchantAccount = `26${payloadKey.length.toString().padStart(2, '0')}${payloadKey}`;
    
    let strPayload = `000201${merchantAccount}520400005303986`;

    if (!isNaN(valorNum) && valorNum > 0) {
      const valStr = valorNum.toFixed(2);
      strPayload += `54${valStr.length.toString().padStart(2, '0')}${valStr}`;
    }

    strPayload += `5802BR59${nome.length.toString().padStart(2, '0')}${nome}60${cidade.length.toString().padStart(2, '0')}${cidade}62070503***6304`;
    
    const crc = CRC16(strPayload);
    const pixCompleto = strPayload + crc;

    document.getElementById('pixCopiaCola').value = pixCompleto;
    document.getElementById('qrcode').innerHTML = "";
    
    new QRCode(document.getElementById("qrcode"), {
      text: pixCompleto,
      width: 200,
      height: 200
    });

    document.getElementById('qrArea').classList.remove('hidden');
  }

  function copiarPix() {
    const input = document.getElementById('pixCopiaCola');
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value);
    alert("Código Pix copiado para a área de transferência!");
  }
</script>

</body>
</html>
