<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QrPix Pro</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4 text-slate-800">

  <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 my-auto border border-slate-200">
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-600 flex items-center justify-center gap-2">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
        QrPix Pro
      </h1>
      <p class="text-xs text-slate-500 mt-1">Gerador de QR Code Pix</p>
    </header>

    <!-- Formulário Principal -->
    <form id="pixForm" onsubmit="generatePix(event)" class="space-y-4">
      
      <!-- Seletor de Chaves Salvas -->
      <div>
        <label for="selectKey" class="block text-xs font-semibold text-slate-600 mb-1">Minhas Chaves Salvas:</label>
        <select id="selectKey" onchange="loadSelectedKey()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-700 font-medium focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">-- Nova Chave / Selecione --</option>
        </select>
      </div>

      <!-- Apelido da Chave -->
      <div>
        <label for="keyAlias" class="block text-xs font-semibold text-slate-600 mb-1">Apelido da Chave:</label>
        <input type="text" id="keyAlias" placeholder="Ex: Mercado Pago, Nubank" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Tipo e Chave -->
      <div class="grid grid-cols-3 gap-2">
        <div class="col-span-1">
          <label for="keyType" class="block text-xs font-semibold text-slate-600 mb-1">Tipo:</label>
          <select id="keyType" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="CPF">CPF</option>
            <option value="CNPJ">CNPJ</option>
            <option value="PHONE">Celular</option>
            <option value="EMAIL">E-mail</option>
            <option value="EVP">Aleatória</option>
          </select>
        </div>
        <div class="col-span-2">
          <label for="pixKey" class="block text-xs font-semibold text-slate-600 mb-1">Chave Pix:</label>
          <input type="text" id="pixKey" required placeholder="Digite a chave" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- Recebedor -->
      <div>
        <label for="merchantName" class="block text-xs font-semibold text-slate-600 mb-1">Nome do Recebedor:</label>
        <input type="text" id="merchantName" required maxlength="25" placeholder="Nome completo ou empresa" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Cidade e Valor -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label for="merchantCity" class="block text-xs font-semibold text-slate-600 mb-1">Cidade:</label>
          <input type="text" id="merchantCity" required maxlength="15" placeholder="Ex: Sao Paulo" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label for="txAmount" class="block text-xs font-semibold text-slate-600 mb-1">Valor (R$) <span class="text-slate-400 font-normal">(Opcional)</span>:</label>
          <input type="text" id="txAmount" placeholder="0,00" oninput="formatCurrency(this)" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- Botões de Salvar/Excluir Chave -->
      <div class="flex gap-2 pt-1">
        <button type="button" onclick="saveCurrentKey()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-3 rounded-lg text-xs transition border border-slate-300 flex items-center justify-center gap-1">
          ★ Salvar / Atualizar Chave
        </button>
        <button type="button" id="btnDeleteKey" onclick="deleteCurrentKey()" class="hidden bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2 px-3 rounded-lg text-xs transition border border-red-200">
          🗑️ Excluir
        </button>
      </div>

      <!-- Gerar QR Code -->
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2 mt-4">
        ⚡ Gerar QR Code Pix
      </button>
    </form>

    <!-- Área de Resultado -->
    <section id="resultArea" class="hidden mt-6 pt-6 border-t border-slate-200 text-center space-y-4">
      <div id="qrcode" class="flex justify-center p-3 bg-white border border-slate-200 rounded-xl inline-block shadow-sm"></div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Código Pix Copia e Cola:</label>
        <textarea id="payloadText" readonly rows="3" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono text-slate-600 break-all focus:outline-none cursor-pointer" onclick="copyPayload()"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="copyPayload()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-2.5 px-3 rounded-lg text-xs border border-blue-200 transition">
          📋 Copiar Código
        </button>
        <button onclick="shareWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1">
          💬 WhatsApp
        </button>
      </div>
    </section>

    <!-- Notificação Toast -->
    <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg transition-opacity duration-300 z-50"></div>
  </main>

  <script>
    const DB_NAME = 'QrPixDB_Pro';
    const DB_VERSION = 1;
    let db = null;

    // Máscara de Moeda (R$)
    function formatCurrency(input) {
      let value = input.value.replace(/\D/g, '');
      if (!value) {
        input.value = '';
        return;
      }
      value = (parseInt(value, 10) / 100).toFixed(2);
      input.value = value.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function getRawAmount() {
      const val = document.getElementById('txAmount').value;
      if (!val) return '0.00';
      return val.replace(/\./g, '').replace(',', '.');
    }

    // Inicialização do IndexedDB
    function initDB() {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains('keys')) {
          database.createObjectStore('keys', { keyPath: 'id', autoIncrement: true });
        }
      };
      request.onsuccess = (e) => {
        db = e.target.result;
        populateKeysSelect();
      };
    }

    // Preencher Seletor de Chaves
    function populateKeysSelect() {
      if (!db) return;
      const tx = db.transaction('keys', 'readonly');
      const store = tx.objectStore('keys');
      const request = store.getAll();

      request.onsuccess = () => {
        const keys = request.result;
        const select = document.getElementById('selectKey');
        select.innerHTML = '<option value="">-- Nova Chave / Selecione --</option>';
        
        keys.forEach(k => {
          const opt = document.createElement('option');
          opt.value = k.id;
          opt.textContent = k.alias || k.key;
          select.appendChild(opt);
        });
      };
    }

    // Carregar dados ao selecionar
    function loadSelectedKey() {
      const id = document.getElementById('selectKey').value;
      const btnDelete = document.getElementById('btnDeleteKey');

      if (!id) {
        document.getElementById('keyAlias').value = '';
        document.getElementById('pixKey').value = '';
        document.getElementById('merchantName').value = '';
        document.getElementById('merchantCity').value = '';
        btnDelete.classList.add('hidden');
        return;
      }

      const tx = db.transaction('keys', 'readonly');
      const store = tx.objectStore('keys');
      const request = store.get(Number(id));

      request.onsuccess = () => {
        const data = request.result;
        if (data) {
          document.getElementById('keyAlias').value = data.alias || '';
          document.getElementById('keyType').value = data.type || 'CPF';
          document.getElementById('pixKey').value = data.key || '';
          document.getElementById('merchantName').value = data.name || '';
          document.getElementById('merchantCity').value = data.city || '';
          btnDelete.classList.remove('hidden');
        }
      };
    }

    // Salvar/Atualizar Chave
    function saveCurrentKey() {
      const alias = document.getElementById('keyAlias').value.trim() || 'Chave Pix';
      const type = document.getElementById('keyType').value;
      const key = document.getElementById('pixKey').value.trim();
      const name = document.getElementById('merchantName').value.trim();
      const city = document.getElementById('merchantCity').value.trim();
      const selectedId = document.getElementById('selectKey').value;

      if (!key || !name || !city) {
        showToast("Preencha Chave, Nome e Cidade para salvar.");
        return;
      }

      const payloadData = { alias, type, key, name, city };
      if (selectedId) payloadData.id = Number(selectedId);

      const tx = db.transaction('keys', 'readwrite');
      const store = tx.objectStore('keys');
      const request = store.put(payloadData);

      request.onsuccess = (e) => {
        showToast("Chave salva com sucesso!");
        const savedId = selectedId || e.target.result;
        populateKeysSelect();
        setTimeout(() => {
          document.getElementById('selectKey').value = savedId;
          loadSelectedKey();
        }, 100);
      };
    }

    // Excluir Chave
    function deleteCurrentKey() {
      const id = document.getElementById('selectKey').value;
      if (!id) return;

      if (confirm("Deseja excluir esta chave salva?")) {
        const tx = db.transaction('keys', 'readwrite');
        const store = tx.objectStore('keys');
        store.delete(Number(id)).onsuccess = () => {
          showToast("Chave excluída.");
          document.getElementById('keyAlias').value = '';
          document.getElementById('pixKey').value = '';
          document.getElementById('merchantName').value = '';
          document.getElementById('merchantCity').value = '';
          document.getElementById('selectKey').value = "";
          document.getElementById('btnDeleteKey').classList.add('hidden');
          populateKeysSelect();
        };
      }
    }

    // Algoritmo CRC16
    function crc16(str) {
      let crc = 0xFFFF;
      for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          } else {
            crc = (crc << 1) & 0xFFFF;
          }
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function formatField(id, val) {
      const len = val.length.toString().padStart(2, '0');
      return `${id}${len}${val}`;
    }

    function sanitizeText(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
    }

    // Gerar Código Pix
    function generatePix(e) {
      e.preventDefault();

      let key = document.getElementById('pixKey').value.trim();
      let name = sanitizeText(document.getElementById('merchantName').value);
      let city = sanitizeText(document.getElementById('merchantCity').value);
      let amountVal = getRawAmount();

      const merchantAccountInfo = formatField('00', 'br.gov.bcb.pix') + formatField('01', key);
      let payload = formatField('00', '01') +
                    formatField('26', merchantAccountInfo) +
                    formatField('52', '0000') +
                    formatField('53', '986');

      if (parseFloat(amountVal) > 0) {
        payload += formatField('54', parseFloat(amountVal).toFixed(2));
      }

      payload += formatField('58', 'BR') +
                 formatField('59', name) +
                 formatField('60', city) +
                 formatField('62', formatField('05', '***')) +
                 '6304';

      payload += crc16(payload);

      // Renderizar QR Code
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: payload,
        width: 180,
        height: 180,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById('payloadText').value = payload;
      document.getElementById('resultArea').classList.remove('hidden');
      document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
    }

    // Copiar Payload
    function copyPayload() {
      const copyText = document.getElementById("payloadText");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      showToast("Código Copia e Cola copiado!");
    }

    // Compartilhar WhatsApp
    function shareWhatsApp() {
      const payload = document.getElementById("payloadText").value;
      const amount = document.getElementById("txAmount").value;
      let msg = `Olá! Segue o código Pix para pagamento:\n\n\`${payload}\``;
      if (amount) {
        msg = `Olá! Segue o Pix no valor de *R$ ${amount}*:\n\n\`${payload}\``;
      }
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    window.onload = () => {
      initDB();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW falhou:', err));
      }
    };
  </script>
</body>
</html>
