<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QrPix</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      background: linear-gradient(180deg, #eef5ff 0%, #dbeafe 100%);
    }
    /* Estilo para barra de rolagem fina no menu cascata */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">

  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 my-auto border border-blue-100">
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">
        Qr<span class="text-cyan-500">Pix</span>
      </h1>
    </header>

    <!-- Formulário Principal -->
    <form id="pixForm" onsubmit="generatePix(event)" class="space-y-4">
      
      <!-- Caixa Banco / Instituição com Menu Cascata Customizado -->
      <div class="relative">
        <label for="bankName" class="block text-xs font-bold text-slate-700 mb-1">Nome do Banco / Instituição:</label>
        <div class="relative">
          <input type="text" id="bankName" autocomplete="off" oninput="filterBanks()" onclick="openBankDropdown()" onfocus="openBankDropdown()" placeholder="Selecione ou digite o banco" class="w-full p-3 pr-10 border border-blue-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400">
          <button type="button" onclick="toggleBankDropdown()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
            ▼
          </button>
        </div>

        <!-- Menu Cascata (Dropdown Container) -->
        <div id="bankDropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-blue-200 rounded-2xl shadow-xl z-50 max-h-60 overflow-y-auto custom-scroll p-1">
          <div id="bankList" class="space-y-0.5"></div>
        </div>
      </div>

      <!-- Apelido da Chave -->
      <div>
        <label for="keyAlias" class="block text-xs font-bold text-slate-700 mb-1">Apelido da Chave:</label>
        <input type="text" id="keyAlias" placeholder="Ex: Conta Principal, Loja, Pessoal" class="w-full p-3 border border-blue-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400">
      </div>

      <!-- Tipo de Chave Pix -->
      <div>
        <label for="keyType" class="block text-xs font-bold text-slate-700 mb-1">Tipo de Chave Pix:</label>
        <select id="keyType" onchange="onKeyTypeChange()" class="w-full p-3 border border-blue-200 rounded-xl text-sm text-slate-700 font-medium focus:ring-2 focus:ring-blue-500 outline-none transition">
          <option value="PHONE">Celular</option>
          <option value="CPF">CPF</option>
          <option value="CNPJ">CNPJ</option>
          <option value="EMAIL">E-mail</option>
          <option value="EVP">Aleatória (EVP)</option>
        </select>
      </div>

      <!-- Chave Pix -->
      <div>
        <label id="lblPixKey" for="pixKey" class="block text-xs font-bold text-slate-700 mb-1">Chave Pix (DDD + Número):</label>
        <input type="text" id="pixKey" required placeholder="(00) 00000-0000" class="w-full p-3 border border-blue-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400">
      </div>

      <!-- Nome do Recebedor -->
      <div>
        <label for="merchantName" class="block text-xs font-bold text-slate-700 mb-1">Nome do Recebedor:</label>
        <input type="text" id="merchantName" required maxlength="25" placeholder="Seu Nome ou Razão Social" class="w-full p-3 border border-blue-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400">
      </div>

      <!-- Cidade -->
      <div>
        <label for="merchantCity" class="block text-xs font-bold text-slate-700 mb-1">Cidade:</label>
        <input type="text" id="merchantCity" required maxlength="15" placeholder="Sua Cidade" class="w-full p-3 border border-blue-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400">
      </div>

      <!-- Valor (R$) (Opcional) -->
      <div>
        <label for="txAmount" class="block text-xs font-bold text-slate-700 mb-1">Valor (R$) (Opcional):</label>
        <input type="text" id="txAmount" placeholder="0,00" oninput="formatCurrency(this)" class="w-full p-3 border border-blue-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400">
      </div>

      <!-- Botões de Ação da Chave -->
      <div class="flex gap-2 pt-1">
        <button type="button" onclick="saveCurrentKey()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-3 rounded-xl text-xs transition border border-slate-200 flex items-center justify-center gap-1">
          ★ Salvar / Atualizar Dados
        </button>
        <button type="button" id="btnDeleteKey" onclick="deleteCurrentKey()" class="hidden bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2 px-3 rounded-xl text-xs transition border border-red-200">
          🗑️ Excluir
        </button>
      </div>

      <!-- Botão Gerar QR Code -->
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition transform active:scale-98 text-sm mt-4">
        Gerar QR Code
      </button>
    </form>

    <!-- Área de Resultado -->
    <section id="resultArea" class="hidden mt-6 pt-6 border-t border-slate-100 text-center space-y-4">
      <div id="qrcode" class="flex justify-center p-3 bg-white border border-slate-200 rounded-2xl inline-block shadow-sm"></div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Código Pix Copia e Cola:</label>
        <textarea id="payloadText" readonly rows="3" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-600 break-all focus:outline-none cursor-pointer" onclick="copyPayload()"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="copyPayload()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-3 px-3 rounded-xl text-xs border border-blue-200 transition">
          📋 Copiar Código
        </button>
        <button onclick="shareWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1">
          💬 WhatsApp
        </button>
      </div>
    </section>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-2xl transition-all duration-300 z-50"></div>
  </main>

  <script>
    const DB_NAME = 'QrPixDB_v3';
    const DB_VERSION = 1;
    let db = null;

    // Lista abrangente de instituições bancárias do Brasil
    const DEFAULT_BANKS = [
      "Nubank (260)", "Itaú Unibanco (341)", "Bradesco (237)", "Banco do Brasil (001)",
      "Caixa Econômica Federal (104)", "Santander Brasil (033)", "Banco Inter (077)",
      "C6 Bank (336)", "Mercado Pago (323)", "PicPay (380)", "PagBank / PagSeguro (290)",
      "Sicoob (756)", "Sicredi (748)", "BTG Pactual (208)", "Banco Pan (623)",
      "Banco Original / PicPay (212)", "Banco BMG (318)", "Banco Safra (422)",
      "XP Investimentos (102)", "Avenue (500)", "Clear Corretora", "Rico Corretora",
      "Neon Pagamentos (536)", "Banco BS2 (218)", "Banco Daycoval (707)",
      "Banco Banrisul (041)", "Banco BRB - Brasília (070)", "Banco do Nordeste - BNB (004)",
      "Banco da Amazônia - BASA (003)", "Ame Digital", "RecargaPay", "InfinitePay",
      "Stone / Pagar.me (197)", "Asaas (198)", "Cora (403)"
    ];

    // Fecha o cascata se clicar fora do campo
    document.addEventListener('click', (e) => {
      const container = document.getElementById('bankName').closest('.relative');
      if (!container.contains(e.target)) {
        closeBankDropdown();
      }
    });

    function toggleBankDropdown() {
      const dropdown = document.getElementById('bankDropdown');
      if (dropdown.classList.contains('hidden')) {
        openBankDropdown();
      } else {
        closeBankDropdown();
      }
    }

    function openBankDropdown() {
      filterBanks(true); // Força exibir a lista completa mesmo se houver texto
      document.getElementById('bankDropdown').classList.remove('hidden');
    }

    function closeBankDropdown() {
      document.getElementById('bankDropdown').classList.add('hidden');
    }

    function filterBanks(showAll = false) {
      const inputVal = showAll ? '' : document.getElementById('bankName').value.toLowerCase().trim();

      const render = (savedBankNames = []) => {
        const allBanks = Array.from(new Set([...savedBankNames, ...DEFAULT_BANKS]));
        const filtered = showAll ? allBanks : allBanks.filter(b => b.toLowerCase().includes(inputVal));
        renderBankList(filtered, savedBankNames);
      };

      if (!db) {
        render([]);
        return;
      }

      const tx = db.transaction('keys', 'readonly');
      const store = tx.objectStore('keys');
      store.getAll().onsuccess = (e) => {
        const savedRecords = e.target.result || [];
        const savedBankNames = savedRecords.map(r => r.bank);
        render(savedBankNames);
      };
    }

    function renderBankList(banks, savedBankNames) {
      const listContainer = document.getElementById('bankList');
      listContainer.innerHTML = '';

      if (banks.length === 0) {
        listContainer.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Nenhum banco encontrado.</div>';
        return;
      }

      // Ordena para que os bancos SALVOS fiquem sempre no topo da lista
      const sortedBanks = [...banks].sort((a, b) => {
        const aSaved = savedBankNames.includes(a);
        const bSaved = savedBankNames.includes(b);
        if (aSaved && !bSaved) return -1;
        if (!aSaved && bSaved) return 1;
        return 0;
      });

      sortedBanks.forEach(bank => {
        const isSaved = savedBankNames.includes(bank);
        const item = document.createElement('div');
        item.className = 'p-2.5 hover:bg-blue-50 cursor-pointer rounded-xl text-xs font-medium text-slate-700 flex items-center justify-between transition';
        
        item.innerHTML = `
          <span>${bank}</span>
          ${isSaved ? '<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">Salvo ★</span>' : ''}
        `;

        item.onclick = () => selectBank(bank);
        listContainer.appendChild(item);
      });
    }

    function selectBank(bankName) {
      document.getElementById('bankName').value = bankName;
      closeBankDropdown();
      onBankChange();
    }

    // Carrega dados do banco selecionado se existir no banco de dados
    function onBankChange() {
      const bankVal = document.getElementById('bankName').value.trim();
      const btnDelete = document.getElementById('btnDeleteKey');

      if (!bankVal || !db) {
        btnDelete.classList.add('hidden');
        return;
      }

      const tx = db.transaction('keys', 'readonly');
      const store = tx.objectStore('keys');
      const request = store.get(bankVal);

      request.onsuccess = () => {
        const data = request.result;
        if (data) {
          document.getElementById('keyAlias').value = data.alias || '';
          document.getElementById('keyType').value = data.type || 'PHONE';
          document.getElementById('pixKey').value = data.key || '';
          document.getElementById('merchantName').value = data.name || '';
          document.getElementById('merchantCity').value = data.city || '';
          updateKeyPlaceholder();
          btnDelete.classList.remove('hidden');
        } else {
          btnDelete.classList.add('hidden');
        }
      };
    }

    // Função acionada ao mudar o Tipo de Chave Pix
    function onKeyTypeChange() {
      // Limpa o campo da chave Pix sem alterar os dados salvos no banco
      document.getElementById('pixKey').value = '';
      updateKeyPlaceholder();
    }

    function updateKeyPlaceholder() {
      const type = document.getElementById('keyType').value;
      const lbl = document.getElementById('lblPixKey');
      const input = document.getElementById('pixKey');

      if (type === 'PHONE') {
        lbl.textContent = 'Chave Pix (DDD + Número):';
        input.placeholder = '(00) 00000-0000';
      } else if (type === 'CPF') {
        lbl.textContent = 'Chave Pix (CPF):';
        input.placeholder = '000.000.000-00';
      } else if (type === 'CNPJ') {
        lbl.textContent = 'Chave Pix (CNPJ):';
        input.placeholder = '00.000.000/0001-00';
      } else if (type === 'EMAIL') {
        lbl.textContent = 'Chave Pix (E-mail):';
        input.placeholder = 'seu@email.com';
      } else {
        lbl.textContent = 'Chave Pix (Chave Aleatória):';
        input.placeholder = '123e4567-e89b-12d3-a456-426614174000';
      }
    }

    // Máscara Automática de Moeda (R$)
    function formatCurrency(input) {
      let value = input.value.replace(/\D/g, '');
      if (!value) {
        input.value = '';
        return;
      }
      value = (parseInt(value, 10) / 100).toFixed(2);
      input.value = value.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function getRawAmount() {
      const val = document.getElementById('txAmount').value;
      if (!val) return '0.00';
      return val.replace(/\./g, '').replace(',', '.');
    }

    // Inicialização IndexedDB
    function initDB() {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains('keys')) {
          database.createObjectStore('keys', { keyPath: 'bank' });
        }
      };
      request.onsuccess = (e) => {
        db = e.target.result;
      };
    }

    function saveCurrentKey() {
      const bank = document.getElementById('bankName').value.trim();
      const alias = document.getElementById('keyAlias').value.trim();
      const type = document.getElementById('keyType').value;
      const key = document.getElementById('pixKey').value.trim();
      const name = document.getElementById('merchantName').value.trim();
      const city = document.getElementById('merchantCity').value.trim();

      if (!bank || !key || !name || !city) {
        showToast("Preencha Banco, Chave, Nome e Cidade para salvar.");
        return;
      }

      const payloadData = { bank, alias, type, key, name, city };

      const tx = db.transaction('keys', 'readwrite');
      const store = tx.objectStore('keys');
      store.put(payloadData).onsuccess = () => {
        showToast("Dados do banco salvos com sucesso!");
        document.getElementById('btnDeleteKey').classList.remove('hidden');
      };
    }

    function deleteCurrentKey() {
      const bank = document.getElementById('bankName').value.trim();
      if (!bank) return;

      if (confirm(`Excluir as configurações salvas para ${bank}?`)) {
        const tx = db.transaction('keys', 'readwrite');
        const store = tx.objectStore('keys');
        store.delete(bank).onsuccess = () => {
          showToast("Dados do banco excluídos.");
          document.getElementById('bankName').value = '';
          document.getElementById('keyAlias').value = '';
          document.getElementById('pixKey').value = '';
          document.getElementById('merchantName').value = '';
          document.getElementById('merchantCity').value = '';
          document.getElementById('btnDeleteKey').classList.add('hidden');
        };
      }
    }

    // CRC16 Oficial PIX
    function crc16(str) {
      let crc = 0xFFFF;
      for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          } else {
            crc = (crc << 1) & 0xFFFF;
          }
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function formatField(id, val) {
      const len = val.length.toString().padStart(2, '0');
      return `${id}${len}${val}`;
    }

    function sanitizeText(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
    }

    function generatePix(e) {
      e.preventDefault();

      let key = document.getElementById('pixKey').value.trim();
      let name = sanitizeText(document.getElementById('merchantName').value);
      let city = sanitizeText(document.getElementById('merchantCity').value);
      let amountVal = getRawAmount();

      const merchantAccountInfo = formatField('00', 'br.gov.bcb.pix') + formatField('01', key);
      let payload = formatField('00', '01') +
                    formatField('26', merchantAccountInfo) +
                    formatField('52', '0000') +
                    formatField('53', '986');

      if (parseFloat(amountVal) > 0) {
        payload += formatField('54', parseFloat(amountVal).toFixed(2));
      }

      payload += formatField('58', 'BR') +
                 formatField('59', name) +
                 formatField('60', city) +
                 formatField('62', formatField('05', '***')) +
                 '6304';

      payload += crc16(payload);

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: payload,
        width: 180,
        height: 180,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById('payloadText').value = payload;
      document.getElementById('resultArea').classList.remove('hidden');
      document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
    }

    function copyPayload() {
      const copyText = document.getElementById("payloadText");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      showToast("Código Copia e Cola copiado!");
    }

    function shareWhatsApp() {
      const payload = document.getElementById("payloadText").value;
      const amount = document.getElementById("txAmount").value;
      let msg = `Olá! Segue o código Pix para pagamento:\n\n\`${payload}\``;
      if (amount) {
        msg = `Olá! Segue o Pix no valor de *R$ ${amount}*:\n\n\`${payload}\``;
      }
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    window.onload = () => {
      initDB();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW falhou:', err));
      }
    };
  </script>
</body>
</html>
