<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Escuro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12151e" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>

    <!-- Sombra de Destaque das Camadas -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo com Cantos Arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Moldura Estilo Scanner Original -->
  <g stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Canto Superior Esquerdo (Coral) -->
    <path d="M 120 160 L 120 120 C 120 115, 125 110, 130 110 L 170 110" stroke="#f0625d" />
    
    <!-- Canto Superior Direito (Verde Água) -->
    <path d="M 342 110 L 382 110 C 387 110, 392 115, 392 120 L 392 160" stroke="#36cfa0" />
    
    <!-- Canto Inferior Esquerdo (Verde Água) -->
    <path d="M 120 290 L 120 330 C 120 335, 125 340, 130 340 L 170 340" stroke="#36cfa0" />
  </g>

  <!-- Ponto Amarelo (Inferior Direito) -->
  <circle cx="370" cy="325" r="10" fill="#ffd54f" />

  <!-- Símbolo Central: Duas Camadas do Pix (Multi Chaves) -->
  <g filter="url(#shadow)">
    <!-- Camada de Trás (Sombra de Múltiplos Perfis/Chaves) -->
    <g transform="translate(-14, -14)" opacity="0.45">
      <polygon points="256,125 286,155 256,185 226,155" fill="#f0625d" />
      <polygon points="201,180 231,210 201,240 171,210" fill="#00a8ff" />
      <polygon points="311,180 341,210 311,240 281,210" fill="#4cd137" />
      <polygon points="256,235 286,265 256,295 226,265" fill="#fbc531" />
    </g>

    <!-- Camada Principal (Frente) -->
    <g transform="translate(6, 6)">
      <!-- Losango Superior (Vermelho Bicolor) -->
      <polygon points="256,125 286,155 256,185 226,155" fill="#ee5253" />
      <polygon points="256,125 286,155 256,185" fill="#d63031" />

      <!-- Losango Esquerda (Azul Bicolor) -->
      <polygon points="201,180 231,210 201,240 171,210" fill="#00a8ff" />
      <polygon points="201,180 231,210 201,240" fill="#0097e6" />

      <!-- Losango Direita (Verde Bicolor) -->
      <polygon points="311,180 341,210 311,240 281,210" fill="#4cd137" />
      <polygon points="311,180 341,210 311,240" fill="#44bd32" />

      <!-- Losango Inferior (Amarelo Bicolor) -->
      <polygon points="256,235 286,265 256,295 226,265" fill="#fbc531" />
      <polygon points="256,235 286,265 256,295" fill="#e1b12c" />

      <!-- Losango Central Branco -->
      <polygon points="256,198 268,210 256,222 244,210" fill="#ffffff" />
    </g>
  </g>

  <!-- Nome Principal: QrPix -->
  <text x="256" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" letter-spacing="1">
    <tspan fill="#ffffff">Qr</tspan><tspan fill="#36cfa0">Pix</tspan>
  </text>

  <!-- Subtítulo: MULTI em Amarelo -->
  <text x="256" y="452" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#ffd54f" letter-spacing="8">
    MULTI
  </text>
</svg>
